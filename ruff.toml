# Целевая версия — минимальная поддерживаемая (docs/BUILD.md: Python 3.9+),
# а не версия CI. Иначе ruff предложит Optional[X] -> X | None в модулях без
# from __future__ import annotations, и сборка сломается на 3.9.
target-version = "py39"
line-length = 120
exclude = ["build", "dist", "AppDir", "debian"]

[lint]
# Намеренно узкий набор: настоящие ошибки (F), мусор в пробелах (W) и
# типовые ловушки (B). Модернизация синтаксиса (UP) — отдельная осознанная
# правка, а не побочный эффект включения линтера.
select = ["E9", "F", "W", "B"]
ignore = [
    "E501",  # длину строк не гоняем: в комментариях и сообщениях она осмысленная
    "B008",  # вызов в значении по умолчанию используется осознанно (output=print)
]

[lint.per-file-ignores]
"tests/**" = ["E402"]
