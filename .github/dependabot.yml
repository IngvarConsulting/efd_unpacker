# Пины actions по SHA замораживают и security-патчи, поэтому Dependabot
# обязателен: без него обновления приходится ловить вручную.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    # Трогать требование только тогда, когда оно правда не пускает новую
    # версию. Иначе каждую неделю приходил PR, поднимающий нижнюю границу
    # `>=` у pytest и соседей: поставить он ничего не менял (pip и так берёт
    # свежее), а объявлял требование, которого у проекта нет, — вплоть до
    # того, что машина разработки нарушала бы собственный requirements.
    # Пины `==` (runtime и pyinstaller) продолжают обновляться: их условие
    # новую версию действительно не допускает.
    versioning-strategy: increase-if-necessary
