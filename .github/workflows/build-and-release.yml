name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Пробный прогон без публикации: собирает и смоук-тестирует всё то же самое,
  # но create-release пропускается — он условен по refs/tags/. Нужен потому,
  # что иначе первый прогон изменений в этом файле совпадал бы с первым релизом.
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пробной сборки. Формат X.Y.Z обязателен: WiX не примет суффикс от git describe.'
        required: false
        default: '0.0.0'
        type: string

env:
  # На пуше тега пусто, и Makefile берёт версию из git describe, как раньше.
  EFD_VERSION: ${{ inputs.version }}

# Минимум по умолчанию; право на запись выдаётся только job'у, который
# действительно публикует релиз.
permissions:
  contents: read

jobs:
  test-suite:
    timeout-minutes: 15
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-2022]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Setup CI environment
        run: |
          make install-test-deps
      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          make test

  build-linux:
    timeout-minutes: 30
    needs: test-suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Setup CI environment
        run: |
          make install-build-deps
      - name: Check dry-run version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Версия пробной сборки: '${EFD_VERSION}'"
          echo "${EFD_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "Нужен формат X.Y.Z: иначе WiX отвергнет версию, а пустое значение означает, что подстановка не сработала."; exit 1; }
      - name: Build Linux version
        run: |
          make build-linux VERSION="$EFD_VERSION"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-builds
          if-no-files-found: error
          path: |
            dist/efd-unpacker-*-linux.AppImage
            dist/efd-unpacker-*-linux*.deb

  build-windows:
    timeout-minutes: 30
    needs: test-suite
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Setup CI environment
        run: |
          make install-build-deps
      - name: Check dry-run version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Версия пробной сборки: '${EFD_VERSION}'"
          echo "${EFD_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "Нужен формат X.Y.Z: иначе WiX отвергнет версию, а пустое значение означает, что подстановка не сработала."; exit 1; }
      - name: Build Windows version
        run: |
          # $env:, а не $: шаг исполняется PowerShell, где $EFD_VERSION —
          # необъявленная переменная, а не окружение.
          make build-windows VERSION="$env:EFD_VERSION"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-builds
          if-no-files-found: error
          path: |
            dist/efd-unpacker-*-windows-setup.exe

  build-macos:
    timeout-minutes: 45
    needs: test-suite
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller не кросс-компилирует, поэтому архитектура раннера и
          # есть архитектура бинаря: нужен отдельный job на каждую.
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" \
            || { echo "Раннер ${{ matrix.runner }} даёт $(uname -m), ожидали ${{ matrix.arch }}"; exit 1; }
      - name: Setup CI environment
        run: |
          make install-build-deps
      - name: Check dry-run version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Версия пробной сборки: '${EFD_VERSION}'"
          echo "${EFD_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "Нужен формат X.Y.Z: иначе WiX отвергнет версию, а пустое значение означает, что подстановка не сработала."; exit 1; }
      - name: Build macOS version
        run: |
          make build-macos VERSION="$EFD_VERSION"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-builds-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/efd-unpacker-*-macos-${{ matrix.arch }}.dmg

  test-appimage:
    timeout-minutes: 15
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-builds
          path: dist
      - name: Move AppImage to root
        run: |
          APPIMAGE="$(find dist -type f -name '*.AppImage' | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage artifact not found under dist"
            find dist -maxdepth 5 -print || true
            exit 1
          fi
          mv "$APPIMAGE" ./efd_unpacker.AppImage
      - name: Test AppImage
        run: |
          chmod +x ./efd_unpacker.AppImage
          mkdir -p "$RUNNER_TEMP/efd-out"
          APPIMAGE_EXTRACT_AND_RUN=1 ./efd_unpacker.AppImage --help
          APPIMAGE_EXTRACT_AND_RUN=1 ./efd_unpacker.AppImage unpack tests/data/1cv8.efd -tmplts "$RUNNER_TEMP/efd-out"
          [ -n "$(find "$RUNNER_TEMP/efd-out" -type f -print -quit)" ] || { echo "AppImage: nothing unpacked"; exit 1; }

  test-deb:
    timeout-minutes: 15
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-builds
          path: dist
      - name: Locate DEB
        run: |
          DEB="$(find dist -type f -name '*.deb' | head -n 1)"
          [ -n "$DEB" ] || { echo "DEB artifact not found under dist"; find dist -maxdepth 5 -print; exit 1; }
          echo "DEB=$DEB" >> "$GITHUB_ENV"
      - name: Inspect package metadata
        run: |
          # Владелец всех членов архива должен быть root/root: без fakeroot
          # сюда уезжал uid сборщика CI.
          if dpkg-deb -c "$DEB" | grep -vE '(^|[[:space:]])root/root([[:space:]]|$)'; then
            echo "DEB: найдены члены архива не с root/root"; exit 1
          fi
          dpkg-deb -c "$DEB" | grep -q './usr/share/doc/efd-unpacker/copyright' \
            || { echo "DEB: нет copyright"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q './usr/share/doc/efd-unpacker/changelog.gz' \
            || { echo "DEB: нет changelog"; exit 1; }
      - name: Lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error,warning \
            --suppress-tags no-manual-page,statically-linked-binary,embedded-library,extended-description-is-probably-too-short,hardening-no-pie \
            "$DEB" || { echo "lintian нашёл проблемы"; exit 1; }
      - name: Test DEB on the runner
        run: |
          sudo apt-get install -y "./$DEB"
          test "$(stat -c %u:%g /usr/bin/efd_unpacker)" = "0:0" \
            || { echo "DEB: /usr/bin/efd_unpacker принадлежит не root"; exit 1; }
          dpkg -L efd-unpacker | grep -q '/usr/share/doc/efd-unpacker/copyright' \
            || { echo "DEB: copyright не установлен"; exit 1; }
          mkdir -p "$RUNNER_TEMP/efd-out"
          efd_unpacker --help
          efd_unpacker unpack tests/data/1cv8.efd -tmplts "$RUNNER_TEMP/efd-out"
          [ -n "$(find "$RUNNER_TEMP/efd-out" -type f -print -quit)" ] || { echo "DEB: nothing unpacked"; exit 1; }
      - name: Reinstall keeps the desktop entry
        run: |
          # Прежний prerm удалял .desktop, принадлежащий пакету, и после
          # переустановки ассоциации пропадали.
          sudo apt-get install -y --reinstall "./$DEB"
          test -f /usr/share/applications/efd_unpacker.desktop \
            || { echo "DEB: .desktop пропал после переустановки"; exit 1; }
      - name: Test DEB on a clean Debian
        run: |
          # Раннер уже несёт десктопные библиотеки, поэтому нехватку Depends
          # на нём не увидеть. Чистый образ — единственная честная проверка.
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/w" -w /w debian:12-slim bash -eux -c '
              apt-get update
              apt-get install -y ./'"$DEB"'
              test "$(stat -c %u:%g /usr/bin/efd_unpacker)" = "0:0"
              efd_unpacker --help
              mkdir -p /tmp/o
              efd_unpacker unpack tests/data/1cv8.efd -tmplts /tmp/o
              test -n "$(find /tmp/o -type f -print -quit)"
            '

  test-windows-setup:
    timeout-minutes: 20
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-builds
          path: dist
      - name: List dist contents
        run: |
          Get-ChildItem -Path dist -Recurse -Force | Format-Table FullName
      - name: Move setup.exe to root
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Recurse -File -Filter *-windows-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Windows setup artifact not found under dist" }
          Move-Item $setup.FullName .\efd_unpacker_setup.exe
      # Расширение .efd на целевой машине уже занято 1С. Установщик обязан
      # встать РЯДОМ, а не вместо: подсадной обработчик ставится до установки
      # и обязан пережить её.
      - name: Plant a prior .efd handler
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Classes\.efd" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Classes\.efd" -Name "(default)" -Value "Prior.efd"
      - name: Test Windows setup
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath .\efd_unpacker_setup.exe -ArgumentList "/quiet","/norestart" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)" }
          # Путь ровно один: MSI собирается с -arch x64 и ставит в
          # ProgramFiles64Folder. Перебор кандидатов был следствием
          # неопределённости — 64-битный exe мог оказаться в
          # Program Files (x86), и смоук-тест это скрывал.
          $exe = "C:\Program Files\EFD Unpacker\EFDUnpacker.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found at $exe" }
          $out = Join-Path $env:TEMP "efd-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Invoke-Efd {
            param([string[]]$EfdArgs, [string]$Label)
            $stdout = Join-Path $env:TEMP "$Label-out.txt"
            $stderr = Join-Path $env:TEMP "$Label-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $EfdArgs -PassThru `
                 -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              throw "$Label timed out after 120s (fell through to GUI mode?)"
            }
            $text = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + `
                    (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            Write-Host "--- $Label (exit $($p.ExitCode)) ---"
            Write-Host $text
            return @{ ExitCode = $p.ExitCode; Output = $text }
          }

          $help = Invoke-Efd -EfdArgs @("--help") -Label "help"
          if ($help.ExitCode -ne 0) { throw "--help exited with $($help.ExitCode)" }
          if ($help.Output -notmatch [regex]::Escape("efd_unpacker unpack <file>... -tmplts <dir>")) {
            throw "--help produced no usage line; windowed build swallows stdout?"
          }

          $unpack = Invoke-Efd -EfdArgs @("unpack", "tests/data/1cv8.efd", "-tmplts", $out) -Label "unpack"
          if ($unpack.ExitCode -ne 0) { throw "unpack exited with $($unpack.ExitCode)" }
          if (-not (Get-ChildItem -Path $out -Recurse -File)) { throw "unpack produced no files" }

          # Повреждённый архив должен давать ненулевой код и называть причину,
          # иначе регрессия в распаковке снова пройдёт gate незамеченной.
          #
          # Спрашиваем --json и ищем КОД ошибки, а не фразу: код —
          # опознаватель, он не зависит ни от формулировки, ни от языка, на
          # который её переведут. Прежняя проверка ждала маркер [ERROR],
          # которого отчёт о битом архиве не печатает вовсе.
          $broken = Join-Path $env:TEMP "broken.efd"
          $bytes = [System.IO.File]::ReadAllBytes("tests/data/1cv8.efd")
          [System.IO.File]::WriteAllBytes($broken, $bytes[0..499])
          $brokenOut = Join-Path $env:TEMP "efd-broken-out"
          New-Item -ItemType Directory -Force -Path $brokenOut | Out-Null
          $bad = Invoke-Efd -EfdArgs @("unpack", $broken, "-tmplts", $brokenOut, "--json") -Label "broken"
          if ($bad.ExitCode -eq 0) { throw "damaged archive reported success" }
          if ($bad.Output -notmatch "unpack_corrupted_archive") { throw "damaged archive named no corrupted-archive error" }

      - name: Check .efd was not taken over
        shell: pwsh
        run: |
          $owner = (Get-ItemProperty "HKLM:\SOFTWARE\Classes\.efd")."(default)"
          if ($owner -ne "Prior.efd") {
            throw "the installer took .efd over: it now says '$owner' instead of 'Prior.efd'"
          }
          $progids = Get-Item "HKLM:\SOFTWARE\Classes\.efd\OpenWithProgids" -ErrorAction SilentlyContinue
          if (-not $progids -or -not ($progids.GetValueNames() -contains "EFDUnpacker.efd")) {
            throw "EFD Unpacker is not offered in Open With"
          }
          Write-Host "prior handler intact, EFD Unpacker offered alongside"

      # Русские подписи мастера обязаны лежать внутри setup.exe по пути,
      # который wixstdba будет искать на русской системе: «1049\thm.wxl».
      # Ошибка в имени или номере языка ничего не ломает — мастер просто
      # молча остаётся английским, и увидеть это можно только глазами на
      # русской Windows. Здесь видно машинно.
      - name: Check the wizard carries Russian strings
        shell: pwsh
        run: |
          $extracted = Join-Path $env:TEMP "bundle"
          dark.exe -nologo -x $extracted .\efd_unpacker_setup.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dark failed to unpack the bundle" }

          $wxl = Get-ChildItem -Path $extracted -Recurse -File -Filter thm.wxl |
                 Where-Object { $_.Directory.Name -eq "1049" } |
                 Select-Object -First 1
          if (-not $wxl) {
            Get-ChildItem -Path $extracted -Recurse -File | ForEach-Object { $_.FullName }
            throw "1049\thm.wxl is not inside the bundle; the wizard stays English"
          }

          $text = Get-Content $wxl.FullName -Raw -Encoding UTF8
          if ($text -notmatch 'Language="1049"') { throw "the embedded wxl is not Russian" }
          if ($text -notmatch "Установить") { throw "the embedded wxl has no Russian text" }
          Write-Host "Russian wizard strings found: $($wxl.FullName)"

  # Переходный апгрейд с 1.x. Проверять его рассуждением нельзя: Burn ставит
  # новую цепочку и только потом снимает старый бандл, а удаление старого MSI
  # уносит файлы, которые новый уже положил, — коды компонентов сменились, и
  # счётчик ссылок их не защищает. Блок RemoveExistingProducts это чинит, но
  # до сих пор был доводом, а не проверкой (критерий 5 в #17).
  test-windows-upgrade:
    timeout-minutes: 25
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-builds
          path: dist
      - name: Move setup.exe to root
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Recurse -File -Filter *-windows-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Windows setup artifact not found under dist" }
          Move-Item $setup.FullName .\efd_unpacker_setup.exe

      - name: Install the released 1.2.11
        shell: pwsh
        run: |
          # Последний выпуск со старым UpgradeCode-заглушкой. Именно с него
          # обновляется тот, кто ставил EFD Unpacker до 2.0.
          $url = "https://github.com/IngvarConsulting/efd_unpacker/releases/download/v1.2.11/efd-unpacker-1.2.11-windows-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile .\old_setup.exe
          $old = Start-Process -FilePath .\old_setup.exe -ArgumentList "/quiet","/norestart" -Wait -PassThru
          if ($old.ExitCode -ne 0) { throw "1.2.11 setup failed with $($old.ExitCode)" }

          # Куда лёг старый — выясняем, а не предполагаем: он собирался
          # 32-битным, то есть мог уйти в Program Files (x86).
          $found = @()
          foreach ($dir in @("C:\Program Files\EFD Unpacker", "C:\Program Files (x86)\EFD Unpacker")) {
            if (Test-Path $dir) { $found += $dir; Get-ChildItem $dir | ForEach-Object { Write-Host "  $($_.FullName)" } }
          }
          if ($found.Count -eq 0) { throw "1.2.11 installed nothing we can find" }
          Write-Host "1.2.11 landed in: $($found -join ', ')"

      - name: Upgrade to the new setup
        shell: pwsh
        run: |
          $new = Start-Process -FilePath .\efd_unpacker_setup.exe -ArgumentList "/quiet","/norestart" -Wait -PassThru
          if ($new.ExitCode -ne 0) { throw "upgrade failed with $($new.ExitCode)" }

      - name: Check the upgrade left a working application
        shell: pwsh
        run: |
          # Ровно один путь: MSI собирается с -arch x64 и ставит в
          # ProgramFiles64Folder.
          $exe = "C:\Program Files\EFD Unpacker\EFDUnpacker.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Filter "EFD Unpacker" -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ChildItem $_.FullName -Recurse | ForEach-Object { Write-Host $_.FullName } }
            throw "after the upgrade $exe is gone — the old uninstall took the new files"
          }

          $out = Join-Path $env:TEMP "help.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--help" -PassThru -RedirectStandardOutput $out
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--help timed out after the upgrade" }
          if ($p.ExitCode -ne 0) { throw "--help exited with $($p.ExitCode) after the upgrade" }
          if ((Get-Content $out -Raw) -notmatch [regex]::Escape("efd_unpacker unpack <file>... -tmplts <dir>")) {
            throw "--help produced no usage line after the upgrade"
          }

          $menus = @(
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\EFD Unpacker",
            "$env:AppData\Microsoft\Windows\Start Menu\Programs\EFD Unpacker"
          )
          $live = $menus | Where-Object { Test-Path $_ }
          if (-not $live) { throw "no Start Menu entry after the upgrade" }
          Write-Host "Start Menu entry at: $($live -join ', ')"

      - name: Uninstall and check nothing is left behind
        shell: pwsh
        run: |
          $gone = Start-Process -FilePath .\efd_unpacker_setup.exe -ArgumentList "/uninstall","/quiet","/norestart" -Wait -PassThru
          if ($gone.ExitCode -ne 0) { throw "uninstall failed with $($gone.ExitCode)" }

          foreach ($menu in @(
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\EFD Unpacker",
            "$env:AppData\Microsoft\Windows\Start Menu\Programs\EFD Unpacker"
          )) {
            if (Test-Path $menu) {
              Get-ChildItem $menu | ForEach-Object { Write-Host $_.FullName }
              throw "Start Menu folder survived the uninstall: $menu"
            }
          }
          if (Test-Path "C:\Program Files\EFD Unpacker\EFDUnpacker.exe") {
            throw "the executable survived the uninstall"
          }
          Write-Host "nothing left behind"

  test-dmg:
    timeout-minutes: 20
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-builds-${{ matrix.arch }}
          path: dist
      - name: List dist contents
        run: find dist -maxdepth 5 -print || true
      - name: Move DMG to root
        run: |
          DMG="$(find dist -type f -name '*.dmg' | head -n 1)"
          if [ -z "$DMG" ]; then
            echo "DMG artifact not found under dist"
            find dist -maxdepth 5 -print || true
            exit 1
          fi
          mv "$DMG" ./efd_unpacker.dmg
      - name: Test DMG
        run: |
          hdiutil attach ./efd_unpacker.dmg
          ls -l "/Volumes/EFD Unpacker/"
          cp -R "/Volumes/EFD Unpacker/EFDUnpacker.app" /tmp/
          ls -l /tmp/EFDUnpacker.app/Contents/MacOS/
          # Без этой проверки сборка с чужого раннера прошла бы незамеченной:
          # именно так релиз годами уезжал только под x86_64.
          BUILT="$(lipo -archs /tmp/EFDUnpacker.app/Contents/MacOS/EFDUnpacker)"
          test "$BUILT" = "${{ matrix.arch }}" \
            || { echo "DMG собран под $BUILT, ожидали ${{ matrix.arch }}"; exit 1; }
          echo "Архитектура бинаря: $BUILT"
          mkdir -p "$RUNNER_TEMP/efd-out"
          /tmp/EFDUnpacker.app/Contents/MacOS/EFDUnpacker --help
          /tmp/EFDUnpacker.app/Contents/MacOS/EFDUnpacker unpack tests/data/1cv8.efd -tmplts "$RUNNER_TEMP/efd-out"
          [ -n "$(find "$RUNNER_TEMP/efd-out" -type f -print -quit)" ] || { echo "DMG: nothing unpacked"; exit 1; }
          hdiutil detach "/Volumes/EFD Unpacker"

  create-release:
    timeout-minutes: 15
    permissions:
      contents: write
    needs: [test-appimage, test-deb, test-windows-setup, test-windows-upgrade, test-dmg]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Нужно для получения истории коммитов

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Create version and generate release notes
        id: release_meta
        run: |
          make create-version
          make generate-release-notes
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: EFD Unpacker ${{ steps.release_meta.outputs.version }}
          body: ${{ steps.release_meta.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux-builds/*
            artifacts/windows-builds/*
            artifacts/macos-builds-x86_64/*
            artifacts/macos-builds-arm64/*
