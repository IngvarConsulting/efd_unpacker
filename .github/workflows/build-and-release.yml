name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Пробный прогон без публикации: собирает и смоук-тестирует всё то же самое,
  # но create-release пропускается — он условен по refs/tags/. Нужен потому,
  # что иначе первый прогон изменений в этом файле совпадал бы с первым релизом.
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пробной сборки. Формат X.Y.Z обязателен: WiX не примет суффикс от git describe.'
        required: false
        default: '0.0.0'
        type: string

env:
  # На пуше тега пусто, и Makefile берёт версию из git describe, как раньше.
  EFD_VERSION: ${{ inputs.version }}

# Минимум по умолчанию; право на запись выдаётся только job'у, который
# действительно публикует релиз.
permissions:
  contents: read

jobs:
  test-suite:
    timeout-minutes: 15
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-2022]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup CI environment
        run: |
          make install-test-deps
      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          make test

  build-linux:
    timeout-minutes: 30
    needs: test-suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup CI environment
        run: |
          make install-build-deps
      - name: Build Linux version
        run: |
          make build-linux VERSION="$EFD_VERSION"
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-builds
          if-no-files-found: error
          path: |
            dist/efd-unpacker-*-linux.AppImage
            dist/efd-unpacker-*-linux*.deb

  build-windows:
    timeout-minutes: 30
    needs: test-suite
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Setup CI environment
        run: |
          make install-build-deps
      - name: Build Windows version
        run: |
          make build-windows VERSION="$EFD_VERSION"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-builds
          if-no-files-found: error
          path: |
            dist/efd-unpacker-*-windows-setup.exe

  build-macos:
    timeout-minutes: 45
    needs: test-suite
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller не кросс-компилирует, поэтому архитектура раннера и
          # есть архитектура бинаря: нужен отдельный job на каждую.
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}" \
            || { echo "Раннер ${{ matrix.runner }} даёт $(uname -m), ожидали ${{ matrix.arch }}"; exit 1; }
      - name: Setup CI environment
        run: |
          make install-build-deps
      - name: Build macOS version
        run: |
          make build-macos VERSION="$EFD_VERSION"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-builds-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/efd-unpacker-*-macos-${{ matrix.arch }}.dmg

  test-appimage:
    timeout-minutes: 15
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-builds
          path: dist
      - name: Move AppImage to root
        run: |
          APPIMAGE="$(find dist -type f -name '*.AppImage' | head -n 1)"
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage artifact not found under dist"
            find dist -maxdepth 5 -print || true
            exit 1
          fi
          mv "$APPIMAGE" ./efd_unpacker.AppImage
      - name: Test AppImage
        run: |
          chmod +x ./efd_unpacker.AppImage
          mkdir -p "$RUNNER_TEMP/efd-out"
          APPIMAGE_EXTRACT_AND_RUN=1 ./efd_unpacker.AppImage --help
          APPIMAGE_EXTRACT_AND_RUN=1 ./efd_unpacker.AppImage unpack tests/data/1cv8.efd -tmplts "$RUNNER_TEMP/efd-out"
          [ -n "$(find "$RUNNER_TEMP/efd-out" -type f -print -quit)" ] || { echo "AppImage: nothing unpacked"; exit 1; }

  test-deb:
    timeout-minutes: 15
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-builds
          path: dist
      - name: Locate DEB
        run: |
          DEB="$(find dist -type f -name '*.deb' | head -n 1)"
          [ -n "$DEB" ] || { echo "DEB artifact not found under dist"; find dist -maxdepth 5 -print; exit 1; }
          echo "DEB=$DEB" >> "$GITHUB_ENV"
      - name: Inspect package metadata
        run: |
          # Владелец всех членов архива должен быть root/root: без fakeroot
          # сюда уезжал uid сборщика CI.
          if dpkg-deb -c "$DEB" | grep -vE '(^|[[:space:]])root/root([[:space:]]|$)'; then
            echo "DEB: найдены члены архива не с root/root"; exit 1
          fi
          dpkg-deb -c "$DEB" | grep -q './usr/share/doc/efd-unpacker/copyright' \
            || { echo "DEB: нет copyright"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q './usr/share/doc/efd-unpacker/changelog.gz' \
            || { echo "DEB: нет changelog"; exit 1; }
      - name: Lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error,warning \
            --suppress-tags no-manual-page,statically-linked-binary,embedded-library,extended-description-is-probably-too-short,hardening-no-pie \
            "$DEB" || { echo "lintian нашёл проблемы"; exit 1; }
      - name: Test DEB on the runner
        run: |
          sudo apt-get install -y "./$DEB"
          test "$(stat -c %u:%g /usr/bin/efd_unpacker)" = "0:0" \
            || { echo "DEB: /usr/bin/efd_unpacker принадлежит не root"; exit 1; }
          dpkg -L efd-unpacker | grep -q '/usr/share/doc/efd-unpacker/copyright' \
            || { echo "DEB: copyright не установлен"; exit 1; }
          mkdir -p "$RUNNER_TEMP/efd-out"
          efd_unpacker --help
          efd_unpacker unpack tests/data/1cv8.efd -tmplts "$RUNNER_TEMP/efd-out"
          [ -n "$(find "$RUNNER_TEMP/efd-out" -type f -print -quit)" ] || { echo "DEB: nothing unpacked"; exit 1; }
      - name: Reinstall keeps the desktop entry
        run: |
          # Прежний prerm удалял .desktop, принадлежащий пакету, и после
          # переустановки ассоциации пропадали.
          sudo apt-get install -y --reinstall "./$DEB"
          test -f /usr/share/applications/efd_unpacker.desktop \
            || { echo "DEB: .desktop пропал после переустановки"; exit 1; }
      - name: Test DEB on a clean Debian
        run: |
          # Раннер уже несёт десктопные библиотеки, поэтому нехватку Depends
          # на нём не увидеть. Чистый образ — единственная честная проверка.
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/w" -w /w debian:12-slim bash -eux -c '
              apt-get update
              apt-get install -y ./'"$DEB"'
              test "$(stat -c %u:%g /usr/bin/efd_unpacker)" = "0:0"
              efd_unpacker --help
              mkdir -p /tmp/o
              efd_unpacker unpack tests/data/1cv8.efd -tmplts /tmp/o
              test -n "$(find /tmp/o -type f -print -quit)"
            '

  test-windows-setup:
    timeout-minutes: 20
    needs: build-windows
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-builds
          path: dist
      - name: List dist contents
        run: |
          Get-ChildItem -Path dist -Recurse -Force | Format-Table FullName
      - name: Move setup.exe to root
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Recurse -File -Filter *-windows-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Windows setup artifact not found under dist" }
          Move-Item $setup.FullName .\efd_unpacker_setup.exe
      - name: Test Windows setup
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath .\efd_unpacker_setup.exe -ArgumentList "/quiet","/norestart" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)" }
          $exeCandidates = @(
            "C:\Program Files\EFD Unpacker\EFDUnpacker.exe",
            "C:\Program Files (x86)\EFD Unpacker\EFDUnpacker.exe",
            "C:\efd_unpacker\EFDUnpacker.exe"
          )
          $exe = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Installed executable not found" }
          $out = Join-Path $env:TEMP "efd-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Invoke-Efd {
            param([string[]]$EfdArgs, [string]$Label)
            $stdout = Join-Path $env:TEMP "$Label-out.txt"
            $stderr = Join-Path $env:TEMP "$Label-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $EfdArgs -PassThru `
                 -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              throw "$Label timed out after 120s (fell through to GUI mode?)"
            }
            $text = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + `
                    (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            Write-Host "--- $Label (exit $($p.ExitCode)) ---"
            Write-Host $text
            return @{ ExitCode = $p.ExitCode; Output = $text }
          }

          $help = Invoke-Efd -EfdArgs @("--help") -Label "help"
          if ($help.ExitCode -ne 0) { throw "--help exited with $($help.ExitCode)" }
          if ($help.Output -notmatch [regex]::Escape("efd_unpacker unpack <input_file.efd> -tmplts <output_dir>")) {
            throw "--help produced no usage line; windowed build swallows stdout?"
          }

          $unpack = Invoke-Efd -EfdArgs @("unpack", "tests/data/1cv8.efd", "-tmplts", $out) -Label "unpack"
          if ($unpack.ExitCode -ne 0) { throw "unpack exited with $($unpack.ExitCode)" }
          if (-not (Get-ChildItem -Path $out -Recurse -File)) { throw "unpack produced no files" }

          # Повреждённый архив должен давать ненулевой код и сообщение об ошибке,
          # иначе регрессия в распаковке снова пройдёт gate незамеченной.
          $broken = Join-Path $env:TEMP "broken.efd"
          $bytes = [System.IO.File]::ReadAllBytes("tests/data/1cv8.efd")
          [System.IO.File]::WriteAllBytes($broken, $bytes[0..499])
          $brokenOut = Join-Path $env:TEMP "efd-broken-out"
          New-Item -ItemType Directory -Force -Path $brokenOut | Out-Null
          $bad = Invoke-Efd -EfdArgs @("unpack", $broken, "-tmplts", $brokenOut) -Label "broken"
          if ($bad.ExitCode -eq 0) { throw "damaged archive reported success" }
          if ($bad.Output -notmatch "\[ERROR\]") { throw "damaged archive printed no [ERROR] line" }

  test-dmg:
    timeout-minutes: 20
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-builds-${{ matrix.arch }}
          path: dist
      - name: List dist contents
        run: find dist -maxdepth 5 -print || true
      - name: Move DMG to root
        run: |
          DMG="$(find dist -type f -name '*.dmg' | head -n 1)"
          if [ -z "$DMG" ]; then
            echo "DMG artifact not found under dist"
            find dist -maxdepth 5 -print || true
            exit 1
          fi
          mv "$DMG" ./efd_unpacker.dmg
      - name: Test DMG
        run: |
          hdiutil attach ./efd_unpacker.dmg
          ls -l "/Volumes/EFD Unpacker/"
          cp -R "/Volumes/EFD Unpacker/EFDUnpacker.app" /tmp/
          ls -l /tmp/EFDUnpacker.app/Contents/MacOS/
          # Без этой проверки сборка с чужого раннера прошла бы незамеченной:
          # именно так релиз годами уезжал только под x86_64.
          BUILT="$(lipo -archs /tmp/EFDUnpacker.app/Contents/MacOS/EFDUnpacker)"
          test "$BUILT" = "${{ matrix.arch }}" \
            || { echo "DMG собран под $BUILT, ожидали ${{ matrix.arch }}"; exit 1; }
          echo "Архитектура бинаря: $BUILT"
          mkdir -p "$RUNNER_TEMP/efd-out"
          /tmp/EFDUnpacker.app/Contents/MacOS/EFDUnpacker --help
          /tmp/EFDUnpacker.app/Contents/MacOS/EFDUnpacker unpack tests/data/1cv8.efd -tmplts "$RUNNER_TEMP/efd-out"
          [ -n "$(find "$RUNNER_TEMP/efd-out" -type f -print -quit)" ] || { echo "DMG: nothing unpacked"; exit 1; }
          hdiutil detach "/Volumes/EFD Unpacker"

  create-release:
    timeout-minutes: 15
    permissions:
      contents: write
    needs: [test-appimage, test-deb, test-windows-setup, test-dmg]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Нужно для получения истории коммитов

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Create version and generate release notes
        id: release_meta
        run: |
          make create-version
          make generate-release-notes
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EFD Unpacker ${{ steps.release_meta.outputs.version }}
          body: ${{ steps.release_meta.outputs.release_notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux-builds/*
            artifacts/windows-builds/*
            artifacts/macos-builds-x86_64/*
            artifacts/macos-builds-arm64/*
